<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wasapedro | En Mantenimiento</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Luces de fondo dinÃ¡micas (Glow Effect) */
    .bg-glow-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(37, 211, 102, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(90px);
      animation: float 10s ease-in-out infinite alternate;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(100px);
      animation: float 14s ease-in-out infinite alternate-reverse;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    /* Tarjeta Glassmorphism Ultra Modern */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 50px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                  0 0 40px rgba(37, 211, 102, 0.08);
    }

    /* Logo con degradado */
    .brand {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 40%, #25d366 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
    }

    /* AnimaciÃ³n del Loader Moderno */
    .loader-container {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 35px;
    }

    .loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
    }

    .loader-ring-1 {
      border-top-color: #25d366;
      border-right-color: #25d366;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      filter: drop-shadow(0 0 8px rgba(37, 211, 102, 0.6));
    }

    .loader-ring-2 {
      inset: 12px;
      border-bottom-color: #059669;
      border-left-color: #059669;
      animation: spin-reverse 1.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .loader-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-icon svg {
      width: 26px;
      height: 26px;
      fill: #25d366;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      100% { transform: rotate(-360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); filter: drop-shadow(0 0 10px #25d366); }
    }

    /* Badge de Estado */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(37, 211, 102, 0.1);
      border: 1px solid rgba(37, 211, 102, 0.25);
      border-radius: 100px;
      color: #25d366;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #25d366;
      border-radius: 50%;
      box-shadow: 0 0 8px #25d366;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* TipografÃ­a */
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    p strong {
      color: #e2e8f0;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="card">
    <div class="brand">wasapedro</div>

    <div class="loader-container">
      <div class="loader-ring loader-ring-1"></div>
      <div class="loader-ring loader-ring-2"></div>
      <div class="loader-icon">
        <svg viewBox="0 0 24 24">
          <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.4-2.4c.4-.4.4-1 0-1.3z"/>
        </svg>
      </div>
    </div>

    <div class="badge">
      <span class="badge-dot"></span>
      Mantenimiento
    </div>

    <h1>Actualizando el sistema</h1>
    <p>Estamos haciendo mejoras en <strong>wasapedro</strong> para brindarte una velocidad y experiencia superior. Volveremos muy pronto.</p>
  </div>

</body>
</html>
